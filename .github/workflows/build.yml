name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk PhoneMIDI.apk

      # Download from the run page: Actions -> this run -> Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneMIDI-apk
          path: PhoneMIDI.apk

      # Direct download link: GitHub repo -> Releases -> "Latest APK" (main/master only)
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          tag_name: latest
          name: Latest APK
          prerelease: true
          files: PhoneMIDI.apk
