plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dalsy.phonemidi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dalsy.phonemidi'
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '1.8'
        ndk {
            // keeps the APK small: real phones only
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    sourceSets {
        main {
            // the hand page (web/manos.html) and MediaPipe for the browser, served inside the app
            assets.srcDirs += ["$buildDir/generated/mpassets", "$rootDir/web"]
        }
    }

    androidResources {
        noCompress 'task', 'tflite'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Hand tracking (21 landmarks per hand)
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}

// The hand model is downloaded once at build time (not stored in git).
def handModel = file('src/main/assets/hand_landmarker.task')
tasks.register('downloadHandModel') {
    outputs.file handModel
    doLast {
        if (!handModel.exists()) {
            handModel.parentFile.mkdirs()
            def url = new URL('https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task')
            url.withInputStream { i -> handModel.withOutputStream { it << i } }
        }
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'downloadHandModel' }

// MediaPipe for the web page inside the app (offline): taken from the npm package at build time.
def mpTgz = file("$buildDir/mp/tasks-vision-0.10.14.tgz")
tasks.register('downloadMpJs') {
    outputs.file mpTgz
    doLast {
        if (!mpTgz.exists()) {
            mpTgz.parentFile.mkdirs()
            new URL('https://registry.npmjs.org/@mediapipe/tasks-vision/-/tasks-vision-0.10.14.tgz')
                    .withInputStream { i -> mpTgz.withOutputStream { it << i } }
        }
    }
}
tasks.register('extractMpJs', Copy) {
    dependsOn 'downloadMpJs'
    from({ tarTree(resources.gzip(mpTgz)) }) {
        include 'package/vision_bundle.mjs', 'package/wasm/vision_wasm_internal.*'
        eachFile { it.path = 'mp/' + it.path.substring('package/'.length()) }
    }
    includeEmptyDirs = false
    into "$buildDir/generated/mpassets"
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'extractMpJs' }
