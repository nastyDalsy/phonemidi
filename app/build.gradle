plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dalsy.phonemidi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dalsy.phonemidi'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
