plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dalsy.phonemidi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dalsy.phonemidi'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4'
        ndk {
            // keeps the APK small: real phones only
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    androidResources {
        noCompress 'task', 'tflite'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Hand tracking (21 landmarks per hand)
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}

// The hand model is downloaded once at build time (not stored in git).
def handModel = file('src/main/assets/hand_landmarker.task')
tasks.register('downloadHandModel') {
    outputs.file handModel
    doLast {
        if (!handModel.exists()) {
            handModel.parentFile.mkdirs()
            def url = new URL('https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task')
            url.withInputStream { i -> handModel.withOutputStream { it << i } }
        }
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'downloadHandModel' }
